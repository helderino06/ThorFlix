<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThorFlix - Backlog Manager</title>
    <style>
        :root {
            --bg-color: #141414;
            --text-color: #e5e5e5;
            --accent: #e50914; /* Netflix Red */
            --navbar-bg: #000000;
            --card-bg: #2f2f2f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            padding-top: 60px;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            background-color: var(--navbar-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }

        .logo { color: var(--accent); font-size: 1.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        
        .btn-add {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-add:active { transform: scale(0.95); }

        /* Contenedor Principal */
        main { padding: 20px; padding-bottom: 50px; }

        /* Categorías */
        .category { margin-bottom: 30px; }
        .category-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; padding-left: 5px; }
        
        .carousel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 5px;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar { display: none; }

        /* Tarjeta de Juego */
        .game-card {
            flex: 0 0 auto;
            width: 140px;
            aspect-ratio: 2 / 3;
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .game-card:hover { transform: scale(1.05); }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }
        .game-card .no-cover {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            color: #888;
        }

        /* Overlay y Detalles en Tarjeta */
        .card-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.9) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
        }
        .badge-console {
            align-self: flex-end;
            background: rgba(0,0,0,0.7);
            border: 1px solid #555;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
            backdrop-filter: blur(2px);
        }
        .card-genre {
            font-size: 0.75rem;
            color: #ddd;
            font-weight: bold;
            text-shadow: 1px 1px 3px black;
            margin-bottom: 6px; /* Espacio para la barra de progreso */
        }

        /* Barra de Progreso Estilo Netflix */
        .progress-container {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 4px;
            background: rgba(255,255,255,0.2);
            pointer-events: none;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        .progress-fill.completed { background: #2ecc71; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background-color: #181818;
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            color: white; font-size: 1.5rem;
            cursor: pointer;
        }

        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }

        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; color: #aaa; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .form-group input[type="text"], .form-group select, .form-group textarea {
            background-color: #333; color: white;
            border: 1px solid #555; border-radius: 4px;
            padding: 10px; outline: none; font-size: 1rem;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
        
        /* Slider de Progreso */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin-top: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #555;
            border-radius: 2px;
        }

        .btn-submit {
            background-color: white; color: black;
            border: none; padding: 12px; border-radius: 4px;
            font-weight: bold; cursor: pointer; font-size: 1rem;
            width: 100%; margin-top: 10px;
        }
        .btn-delete { background-color: transparent; color: #aaa; border: 1px solid #555; margin-top: 10px; }
        
        .empty-state { padding: 40px 20px; text-align: center; color: #666; font-size: 1.1rem; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ThorFlix</div>
        <button class="btn-add" id="btn-open-add">+ Añadir</button>
    </nav>

    <main id="main-content">
        <!-- Generado por JS -->
    </main>

    <div class="modal" id="game-modal">
        <div class="modal-content">
            <button class="close-btn" id="btn-close-modal">✖</button>
            <h2 id="modal-title" style="margin-bottom: 20px;">Añadir al Catálogo</h2>
            
            <input type="hidden" id="game-id">
            
            <div class="form-group">
                <label>Título del Juego</label>
                <input type="text" id="game-title" placeholder="Ej: Super Metroid" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Consola</label>
                    <input type="text" id="game-console" placeholder="Ej: SNES, GBA, PS1">
                </div>
                <div class="form-group">
                    <label>Género</label>
                    <input type="text" id="game-genre" placeholder="Ej: RPG, Plataformas">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Progreso <span id="progress-label" style="color:white; font-weight:bold;">0%</span></label>
                    <input type="range" id="game-progress" min="0" max="100" value="0">
                </div>
                <div class="form-group" style="flex: 3;">
                    <label>Estado</label>
                    <select id="game-status">
                        <option value="playing">Jugando Actualmente</option>
                        <option value="backlog">Pendiente (Backlog)</option>
                        <option value="completed">Completado</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Subir Carátula (Opcional)</label>
                <button class="btn-submit" style="background:#444; color:white; margin-top:0;" id="btn-upload-cover">📸 Seleccionar Imagen</button>
                <input type="file" id="file-input" accept="image/*" style="display:none;">
                <img id="cover-preview" style="max-width: 100px; margin-top: 10px; border-radius: 4px; display: none;">
            </div>

            <div class="form-group">
                <label>Notas o Reseña</label>
                <textarea id="game-notes" rows="2" placeholder="Tus impresiones, trucos..."></textarea>
            </div>

            <button class="btn-submit" id="btn-save-game">Guardar Juego</button>
            <button class="btn-submit btn-delete" id="btn-delete-game" style="display:none;">Eliminar de la lista</button>
        </div>
    </div>

    <script>
        // --- Estado de la Base de Datos ---
        let library = JSON.parse(localStorage.getItem('thorflix_data')) || [];
        let tempCoverData = null; 
        const modal = document.getElementById('game-modal');
        const mainContent = document.getElementById('main-content');
        const progressSlider = document.getElementById('game-progress');
        const progressLabel = document.getElementById('progress-label');
        const statusSelect = document.getElementById('game-status');

        // Actualizar etiqueta del slider en tiempo real
        progressSlider.addEventListener('input', (e) => {
            progressLabel.textContent = e.target.value + '%';
            if(e.target.value === "100") statusSelect.value = "completed";
        });

        // Si se marca como completado, subir progreso a 100
        statusSelect.addEventListener('change', (e) => {
            if(e.target.value === 'completed') {
                progressSlider.value = 100;
                progressLabel.textContent = '100%';
            }
        });

        function renderLibrary() {
            mainContent.innerHTML = '';
            const playing = library.filter(g => g.status === 'playing');
            const backlog = library.filter(g => g.status === 'backlog');
            const completed = library.filter(g => g.status === 'completed');

            if (library.length === 0) {
                mainContent.innerHTML = `<div class="empty-state">Tu catálogo está vacío.<br>Pulsa "+ Añadir" para empezar.</div>`;
                return;
            }

            if (playing.length > 0) createRow('Jugando Actualmente', playing);
            if (backlog.length > 0) createRow('Mi Lista (Pendientes)', backlog);
            if (completed.length > 0) createRow('Completados', completed);
        }

        function createRow(title, games) {
            const section = document.createElement('div');
            section.className = 'category';
            section.innerHTML = `<h2 class="category-title">${title}</h2>`;

            const carousel = document.createElement('div');
            carousel.className = 'carousel';

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => editGame(game.id);

                const coverHtml = game.cover ? `<img src="${game.cover}" alt="${game.title}">` : `<div class="no-cover">${game.title}</div>`;
                const consoleBadge = game.console ? `<div class="badge-console">${game.console}</div>` : '<div></div>';
                const genreText = game.genre ? `<div class="card-genre">${game.genre}</div>` : '';
                
                const progressClass = game.status === 'completed' || game.progress == 100 ? 'progress-fill completed' : 'progress-fill';
                const progressHtml = `<div class="progress-container"><div class="${progressClass}" style="width: ${game.progress || 0}%"></div></div>`;

                card.innerHTML = `
                    ${coverHtml}
                    <div class="card-overlay">
                        ${consoleBadge}
                        ${genreText}
                    </div>
                    ${progressHtml}
                `;
                
                carousel.appendChild(card);
            });

            section.appendChild(carousel);
            mainContent.appendChild(section);
        }

        function openModal(isEdit = false) {
            modal.style.display = 'flex';
            if (!isEdit) {
                document.getElementById('modal-title').textContent = 'Añadir al Catálogo';
                document.getElementById('game-id').value = '';
                document.getElementById('game-title').value = '';
                document.getElementById('game-console').value = '';
                document.getElementById('game-genre').value = '';
                document.getElementById('game-status').value = 'playing';
                document.getElementById('game-notes').value = '';
                progressSlider.value = 0;
                progressLabel.textContent = '0%';
                document.getElementById('cover-preview').style.display = 'none';
                document.getElementById('btn-delete-game').style.display = 'none';
                tempCoverData = null;
            }
        }

        document.getElementById('btn-close-modal').onclick = () => modal.style.display = 'none';
        document.getElementById('btn-open-add').onclick = () => openModal(false);

        function editGame(id) {
            const game = library.find(g => g.id === id);
            if (!game) return;

            document.getElementById('modal-title').textContent = 'Editar Juego';
            document.getElementById('game-id').value = game.id;
            document.getElementById('game-title').value = game.title;
            document.getElementById('game-console').value = game.console || '';
            document.getElementById('game-genre').value = game.genre || '';
            document.getElementById('game-status').value = game.status;
            document.getElementById('game-notes').value = game.notes || '';
            
            progressSlider.value = game.progress || 0;
            progressLabel.textContent = (game.progress || 0) + '%';
            
            tempCoverData = game.cover || null;
            const preview = document.getElementById('cover-preview');
            if (tempCoverData) {
                preview.src = tempCoverData;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }

            document.getElementById('btn-delete-game').style.display = 'block';
            openModal(true);
        }

        document.getElementById('btn-upload-cover').onclick = () => document.getElementById('file-input').click();
        
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300; 
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    tempCoverData = canvas.toDataURL('image/jpeg', 0.7);
                    const preview = document.getElementById('cover-preview');
                    preview.src = tempCoverData;
                    preview.style.display = 'block';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            this.value = '';
        });

        document.getElementById('btn-save-game').onclick = () => {
            const id = document.getElementById('game-id').value;
            const title = document.getElementById('game-title').value.trim();
            const consoleName = document.getElementById('game-console').value.trim();
            const genre = document.getElementById('game-genre').value.trim();
            const status = document.getElementById('game-status').value;
            const notes = document.getElementById('game-notes').value;
            const progress = parseInt(progressSlider.value);

            if (!title) { alert('El título es obligatorio'); return; }

            const gameObj = {
                id: id ? parseInt(id) : Date.now(),
                title, console: consoleName, genre, status, notes, progress,
                cover: tempCoverData
            };

            if (id) {
                const index = library.findIndex(g => g.id === parseInt(id));
                library[index] = gameObj;
            } else {
                library.push(gameObj);
            }

            try {
                localStorage.setItem('thorflix_data', JSON.stringify(library));
                modal.style.display = 'none';
                renderLibrary();
            } catch (e) {
                alert("Memoria llena. Borra algunos juegos o imágenes.");
            }
        };

        document.getElementById('btn-delete-game').onclick = () => {
            if(confirm("¿Eliminar este juego de tu lista?")) {
                const id = parseInt(document.getElementById('game-id').value);
                library = library.filter(g => g.id !== id);
                localStorage.setItem('thorflix_data', JSON.stringify(library));
                modal.style.display = 'none';
                renderLibrary();
            }
        };

        renderLibrary();
    </script>
</body>
</html>
