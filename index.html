<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ThorFlix - Backlog Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #040406;
            --bg-surface: #0e0e12;
            --bg-card: #15151c;
            --accent: #ff2a3b;
            --accent-gradient: linear-gradient(135deg, #ff2a3b 0%, #b30012 100%);
            --accent-glow: rgba(255, 42, 59, 0.4);
            --text-main: #fafafa;
            --text-muted: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 42, 59, 0.5);
            --star-color: #fbbf24;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            padding-top: 85px;
            min-height: 100vh;
            position: relative;
        }

        /* Fondo Animado y Dinámico (Malla de Gradientes / Aurora) */
        .bg-ambient {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, #12080a 0%, #040406 70%);
        }

        .bg-glow-1 {
            position: absolute;
            top: -15vh;
            left: -10vw;
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(255, 42, 59, 0.12) 0%, rgba(179, 0, 18, 0.03) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            top: 30vh;
            right: -15vw;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(147, 51, 234, 0.02) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: floatGlow2 15s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5vw, 10vh) scale(1.1); }
        }

        @keyframes floatGlow2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-7vw, -8vh) scale(1.15); }
        }

        /* Navbar Cinematográfica con Glassmorphism Profundo */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 75px;
            background: rgba(4, 4, 6, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo { 
            color: var(--text-main); 
            font-size: 1.6rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
        }

        .logo span {
            color: var(--accent);
            text-shadow: 0 0 25px var(--accent-glow);
        }
        
        .btn-add {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 6px 20px var(--accent-glow);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-add:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 8px 25px var(--accent-glow); }
        .btn-add:active { transform: scale(0.96); }

        /* Contenedor Principal */
        main { padding: 32px 24px 60px 24px; max-width: 1500px; margin: 0 auto; position: relative; z-index: 1; }

        /* Categorías Estilo Streaming */
        .category { margin-bottom: 40px; }
        .category-title { 
            font-size: 1.3rem; 
            font-weight: 700; 
            margin-bottom: 16px; 
            padding-left: 6px; 
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }
        .category-title::before {
            content: '';
            display: block;
            width: 5px;
            height: 20px;
            background: var(--accent-gradient);
            border-radius: 4px;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        
        .carousel {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            padding: 12px 4px 20px 4px;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar { display: none; }

        /* Tarjeta de Juego Cinematográfica con Sutil Brillo de Borde */
        .game-card {
            flex: 0 0 auto;
            width: 160px;
            aspect-ratio: 2 / 3;
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid var(--border-subtle);
        }
        .game-card:hover { 
            transform: translateY(-8px) scale(1.03); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 30px rgba(255, 42, 59, 0.3);
            border-color: var(--border-active);
        }
        .game-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .game-card:hover img { transform: scale(1.04); }

        .game-card .no-cover {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 16px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-muted);
            background: linear-gradient(135deg, #181822, #0d0d12);
        }

        /* Overlay y Detalles en Tarjeta */
        .card-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(4,4,6,0.8) 0%, rgba(4,4,6,0) 35%, rgba(4,4,6,0) 55%, rgba(4,4,6,0.96) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }
        .overlay-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }
        .badge-console {
            background: rgba(14, 14, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 4px 9px;
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: 800;
            color: #fff;
            backdrop-filter: blur(6px);
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .badge-rating {
            background: rgba(14, 14, 18, 0.85);
            border: 1px solid rgba(251, 191, 36, 0.25);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--star-color);
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .card-genre {
            font-size: 0.78rem;
            color: #cbd5e1;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Barra de Progreso Avanzada */
        .progress-container {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff2a3b, #ff7a00);
            transition: width 0.5s cubic-bezier(0.1, 0.8, 0.3, 1);
            border-radius: 0 0 0 16px;
        }
        .progress-fill.completed { background: linear-gradient(90deg, #10b981, #34d399); }

        /* Modal Ultra Limpio y Moderno con Efecto Glass */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(4, 4, 6, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.94) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-content {
            background-color: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 520px;
            border-radius: 24px;
            padding: 32px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 50px rgba(255, 42, 59, 0.15);
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 22px; right: 22px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .close-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; transform: rotate(90deg); }

        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 8px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; display: flex; justify-content: space-between; letter-spacing: 0.3px; }
        
        .form-group input[type="text"], .form-group select, .form-group textarea {
            background-color: #121218; 
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 12px;
            padding: 13px 16px; 
            outline: none; 
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }
        .form-group input[type="text"]:focus, .form-group select:focus, .form-group textarea:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 4px var(--accent-glow);
            background-color: #1a1a24;
        }
        
        /* Slider de Progreso Estilizado */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin-top: 14px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent);
            border: 3px solid var(--accent);
            margin-top: -8px;
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%; height: 5px;
            cursor: pointer;
            background: #22222f;
            border-radius: 3px;
        }

        /* Estrellas Estéticas */
        .star-rating {
            display: flex;
            gap: 10px;
            font-size: 1.9rem;
            color: #262633;
            cursor: pointer;
            justify-content: center;
            background: #121218;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .star-rating span { transition: color 0.2s ease, transform 0.2s ease; }
        .star-rating span:hover { transform: scale(1.15); color: #fde047; }
        .star-rating span.active { color: var(--star-color); text-shadow: 0 0 12px rgba(251, 191, 36, 0.5); }

        .btn-submit {
            background: var(--accent-gradient);
            color: white;
            border: none; padding: 15px; border-radius: 12px;
            font-weight: 700; cursor: pointer; font-size: 1rem;
            width: 100%; margin-top: 14px;
            box-shadow: 0 6px 20px var(--accent-glow);
            transition: all 0.2s ease;
        }
        .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-submit:active { transform: scale(0.98); }

        .btn-secondary {
            background: rgba(139, 92, 246, 0.15); color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.3); margin-top: 0;
            box-shadow: none;
        }
        .btn-secondary:hover { background: rgba(139, 92, 246, 0.25); filter: none; }

        .btn-delete { 
            background-color: transparent; 
            color: #f87171; 
            border: 1px solid rgba(248, 113, 113, 0.3); 
            margin-top: 14px;
            box-shadow: none;
        }
        .btn-delete:hover { background: rgba(248, 113, 113, 0.1); filter: none; }
        
        .empty-state { 
            padding: 70px 20px; 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 1.1rem;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Fondo Dinámico con Aurora y Luces Ambientales -->
    <div class="bg-ambient">
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
    </div>

    <nav>
        <div class="logo-container">
            <div class="logo">Thor<span>Flix</span></div>
        </div>
        <button class="btn-add" id="btn-open-add"><span>+</span> Añadir Juego</button>
    </nav>

    <main id="main-content">
        <!-- Generado por JS -->
    </main>

    <div class="modal" id="game-modal">
        <div class="modal-content">
            <button class="close-btn" id="btn-close-modal">✕</button>
            <h2 id="modal-title" style="margin-bottom: 24px; font-weight: 700; font-size: 1.4rem;">Añadir al Catálogo</h2>
            
            <input type="hidden" id="game-id">
            
            <div class="form-group">
                <label>Título del Juego</label>
                <input type="text" id="game-title" placeholder="Ej: Super Metroid" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Consola</label>
                    <input type="text" id="game-console" placeholder="Ej: SNES, GBA, PS1">
                </div>
                <div class="form-group">
                    <label>Género</label>
                    <input type="text" id="game-genre" placeholder="Ej: RPG, Plataformas">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Progreso <span id="progress-label" style="color:#fff; font-weight:700;">0%</span></label>
                    <input type="range" id="game-progress" min="0" max="100" value="0">
                </div>
                <div class="form-group" style="flex: 3;">
                    <label>Estado</label>
                    <select id="game-status">
                        <option value="playing">Jugando Actualmente</option>
                        <option value="backlog">Pendiente (Backlog)</option>
                        <option value="completed">Completado</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Valoración Personal</label>
                <div class="star-rating" id="star-rating">
                    <span data-value="1">★</span>
                    <span data-value="2">★</span>
                    <span data-value="3">★</span>
                    <span data-value="4">★</span>
                    <span data-value="5">★</span>
                </div>
                <input type="hidden" id="game-rating" value="0">
            </div>
            
            <div class="form-group">
                <label>Carátula (Sube la tuya o busca en Google)</label>
                <div style="display: flex; gap: 12px; margin-top: 6px;">
                    <button class="btn-submit" style="background:#1c1c26; color:white; margin:0; flex:1; box-shadow:none; border: 1px solid rgba(255,255,255,0.08);" id="btn-upload-cover">📸 Subir</button>
                    <button class="btn-submit btn-secondary" style="flex:1;" id="btn-search-cover">🔍 Buscar</button>
                </div>
                <input type="file" id="file-input" accept="image/*" style="display:none;">
                <img id="cover-preview" style="max-width: 95px; margin-top: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); display: none;">
            </div>

            <div class="form-group">
                <label>Notas o Reseña</label>
                <textarea id="game-notes" rows="2" placeholder="Tus impresiones, trucos..."></textarea>
            </div>

            <button class="btn-submit" id="btn-save-game">Guardar Juego</button>
            <button class="btn-submit btn-delete" id="btn-delete-game" style="display:none;">Eliminar de la lista</button>
        </div>
    </div>

    <script>
        let library = JSON.parse(localStorage.getItem('thorflix_data')) || [];
        let tempCoverData = null; 
        const modal = document.getElementById('game-modal');
        const mainContent = document.getElementById('main-content');
        const progressSlider = document.getElementById('game-progress');
        const progressLabel = document.getElementById('progress-label');
        const statusSelect = document.getElementById('game-status');
        
        const stars = document.querySelectorAll('#star-rating span');
        const ratingInput = document.getElementById('game-rating');

        stars.forEach(star => {
            star.onclick = () => {
                const val = parseInt(star.getAttribute('data-value'));
                ratingInput.value = val === parseInt(ratingInput.value) ? 0 : val;
                updateStars(ratingInput.value);
            };
        });

        function updateStars(val) {
            stars.forEach(s => {
                if(parseInt(s.getAttribute('data-value')) <= val) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        document.getElementById('btn-search-cover').onclick = (e) => {
            e.preventDefault();
            const title = document.getElementById('game-title').value.trim();
            const consoleName = document.getElementById('game-console').value.trim();
            if(!title) {
                alert("Escribe al menos el título del juego para buscar su carátula.");
                return;
            }
            const query = encodeURIComponent(`${title} ${consoleName} cover art box art IGDB`);
            window.open('https://www.google.com/search?tbm=isch&q=' + query, '_blank');
        };

        progressSlider.addEventListener('input', (e) => {
            progressLabel.textContent = e.target.value + '%';
            if(e.target.value === "100") statusSelect.value = "completed";
        });

        statusSelect.addEventListener('change', (e) => {
            if(e.target.value === 'completed') {
                progressSlider.value = 100;
                progressLabel.textContent = '100%';
            }
        });

        function renderLibrary() {
            mainContent.innerHTML = '';
            const playing = library.filter(g => g.status === 'playing');
            const backlog = library.filter(g => g.status === 'backlog');
            const completed = library.filter(g => g.status === 'completed');

            if (library.length === 0) {
                mainContent.innerHTML = `<div class="empty-state">Tu catálogo está vacío.<br>Pulsa <b>"+ Añadir Juego"</b> para empezar a organizar tu colección.</div>`;
                return;
            }

            if (playing.length > 0) createRow('Jugando Actualmente', playing);
            if (backlog.length > 0) createRow('Mi Lista (Pendientes)', backlog);
            if (completed.length > 0) createRow('Completados', completed);
        }

        function createRow(title, games) {
            const section = document.createElement('div');
            section.className = 'category';
            section.innerHTML = `<h2 class="category-title">${title}</h2>`;

            const carousel = document.createElement('div');
            carousel.className = 'carousel';

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => editGame(game.id);

                const coverHtml = game.cover ? `<img src="${game.cover}" alt="${game.title}">` : `<div class="no-cover">${game.title}</div>`;
                const consoleBadge = game.console ? `<div class="badge-console">${game.console}</div>` : '<div></div>';
                const ratingBadge = (game.rating && game.rating > 0) ? `<div class="badge-rating">★ ${game.rating}</div>` : '<div></div>';
                const genreText = game.genre ? `<div class="card-genre">${game.genre}</div>` : '';
                
                const progressClass = game.status === 'completed' || game.progress == 100 ? 'progress-fill completed' : 'progress-fill';
                const progressHtml = `<div class="progress-container"><div class="${progressClass}" style="width: ${game.progress || 0}%"></div></div>`;

                card.innerHTML = `
                    ${coverHtml}
                    <div class="card-overlay">
                        <div class="overlay-top">
                            ${ratingBadge}
                            ${consoleBadge}
                        </div>
                        ${genreText}
                    </div>
                    ${progressHtml}
                `;
                
                carousel.appendChild(card);
            });

            section.appendChild(carousel);
            mainContent.appendChild(section);
        }

        function openModal(isEdit = false) {
            modal.style.display = 'flex';
            if (!isEdit) {
                document.getElementById('modal-title').textContent = 'Añadir al Catálogo';
                document.getElementById('game-id').value = '';
                document.getElementById('game-title').value = '';
                document.getElementById('game-console').value = '';
                document.getElementById('game-genre').value = '';
                document.getElementById('game-status').value = 'playing';
                document.getElementById('game-notes').value = '';
                
                progressSlider.value = 0;
                progressLabel.textContent = '0%';
                
                ratingInput.value = 0;
                updateStars(0);

                document.getElementById('cover-preview').style.display = 'none';
                document.getElementById('btn-delete-game').style.display = 'none';
                tempCoverData = null;
            }
        }

        document.getElementById('btn-close-modal').onclick = () => modal.style.display = 'none';
        document.getElementById('btn-open-add').onclick = () => openModal(false);

        function editGame(id) {
            const game = library.find(g => g.id === id);
            if (!game) return;

            document.getElementById('modal-title').textContent = 'Editar Juego';
            document.getElementById('game-id').value = game.id;
            document.getElementById('game-title').value = game.title;
            document.getElementById('game-console').value = game.console || '';
            document.getElementById('game-genre').value = game.genre || '';
            document.getElementById('game-status').value = game.status;
            document.getElementById('game-notes').value = game.notes || '';
            
            progressSlider.value = game.progress || 0;
            progressLabel.textContent = (game.progress || 0) + '%';
            
            ratingInput.value = game.rating || 0;
            updateStars(game.rating || 0);
            
            tempCoverData = game.cover || null;
            const preview = document.getElementById('cover-preview');
            if (tempCoverData) {
                preview.src = tempCoverData;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }

            document.getElementById('btn-delete-game').style.display = 'block';
            openModal(true);
        }

        document.getElementById('btn-upload-cover').onclick = () => document.getElementById('file-input').click();
        
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300; 
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const canvasCtx = canvas.getContext('2d');
                    canvasCtx.drawImage(img, 0, 0, width, height);
                    tempCoverData = canvas.toDataURL('image/jpeg', 0.7);
                    const preview = document.getElementById('cover-preview');
                    preview.src = tempCoverData;
                    preview.style.display = 'block';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            this.value = '';
        });

        document.getElementById('btn-save-game').onclick = () => {
            const id = document.getElementById('game-id').value;
            const title = document.getElementById('game-title').value.trim();
            const consoleName = document.getElementById('game-console').value.trim();
            const genre = document.getElementById('game-genre').value.trim();
            const status = document.getElementById('game-status').value;
            const notes = document.getElementById('game-notes').value;
            const progress = parseInt(progressSlider.value);
            const rating = parseInt(ratingInput.value);

            if (!title) { alert('El título es obligatorio'); return; }

            const gameObj = {
                id: id ? parseInt(id) : Date.now(),
                title, console: consoleName, genre, status, notes, progress, rating,
                cover: tempCoverData
            };

            if (id) {
                const index = library.findIndex(g => g.id === parseInt(id));
                library[index] = gameObj;
            } else {
                library.push(gameObj);
            }

            try {
                localStorage.setItem('thorflix_data', JSON.stringify(library));
                modal.style.display = 'none';
                renderLibrary();
            } catch (e) {
                alert("Memoria llena. Borra algunos juegos o imágenes.");
            }
        };

        document.getElementById('btn-delete-game').onclick = () => {
            if(confirm("¿Eliminar este juego de tu lista?")) {
                const id = parseInt(document.getElementById('game-id').value);
                library = library.filter(g => g.id !== id);
                localStorage.setItem('thorflix_data', JSON.stringify(library));
                modal.style.display = 'none';
                renderLibrary();
            }
        };

        renderLibrary();
    </script>
</body>
</html>
